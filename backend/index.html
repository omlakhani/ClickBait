<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Voice Pipeline</title>
    <link rel="icon" href="data:," />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body
    class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4"
  >
    <div
      class="max-w-2xl w-full bg-gray-800 rounded-2xl shadow-2xl p-8 border border-gray-700"
    >
      <h1
        class="text-3xl font-bold mb-8 text-center bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent"
      >
        Local AI Voice Pipeline
      </h1>

      <div class="flex flex-col items-center gap-6">
        <div
          id="status"
          class="text-sm font-medium text-gray-400 uppercase tracking-widest"
        >
          Ready
        </div>

        <div class="flex gap-4">
          <button
            id="startBtn"
            class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-full transition-all transform hover:scale-105 active:scale-95 shadow-lg flex items-center gap-2"
          >
            <span class="w-3 h-3 bg-white rounded-full"></span> Record
          </button>
          <button
            id="stopBtn"
            disabled
            class="bg-red-600 hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-4 px-8 rounded-full transition-all transform hover:scale-105 active:scale-95 shadow-lg flex items-center gap-2"
          >
            <span class="w-3 h-3 bg-white rounded-md"></span> Stop
          </button>
        </div>

        <div
          id="recordingIndicator"
          class="hidden flex items-center gap-2 text-red-500 font-bold"
        >
          <div class="w-3 h-3 bg-red-500 rounded-full pulse"></div>
          Recording...
        </div>
      </div>

      <div class="mt-12 space-y-6">
        <div id="transcriptSection" class="hidden">
          <h2 class="text-sm font-semibold text-gray-400 uppercase mb-2">
            You said:
          </h2>
          <p
            id="transcriptText"
            class="bg-gray-900 p-4 rounded-lg border border-gray-700 text-gray-200"
          ></p>
        </div>

        <div id="replySection" class="hidden">
          <h2 class="text-sm font-semibold text-gray-400 uppercase mb-2">
            Agent reply:
          </h2>
          <p
            id="replyText"
            class="bg-blue-900/30 p-4 rounded-lg border border-blue-800/50 text-blue-100"
          ></p>
          <audio id="replyAudio" controls class="mt-4 w-full"></audio>
        </div>
      </div>
    </div>

    <script>
      let mediaRecorder;
      let audioChunks = [];
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const status = document.getElementById("status");
      const indicator = document.getElementById("recordingIndicator");
      const transcriptSection = document.getElementById("transcriptSection");
      const transcriptText = document.getElementById("transcriptText");
      const replySection = document.getElementById("replySection");
      const replyText = document.getElementById("replyText");
      const replyAudio = document.getElementById("replyAudio");

      startBtn.onclick = async () => {
        audioChunks = [];
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: true,
        });
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = (event) => {
          audioChunks.push(event.data);
        };

        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
          await uploadAudio(audioBlob);
        };

        mediaRecorder.start();
        startBtn.disabled = true;
        stopBtn.disabled = false;
        status.textContent = "Recording...";
        indicator.classList.remove("hidden");
        transcriptSection.classList.add("hidden");
        replySection.classList.add("hidden");
      };

      stopBtn.onclick = () => {
        mediaRecorder.stop();
        startBtn.disabled = false;
        stopBtn.disabled = true;
        status.textContent = "Processing...";
        indicator.classList.add("hidden");
      };

      async function uploadAudio(blob) {
        const formData = new FormData();
        formData.append("file", blob, "input.webm");

        try {
          const response = await fetch("/api/voice-chat", {
            method: "POST",
            body: formData,
          });
          const data = await response.json();

          if (data.error) throw new Error(data.error);

          transcriptSection.classList.remove("hidden");
          transcriptText.textContent = data.transcript;

          replySection.classList.remove("hidden");
          replyText.textContent = data.reply_text;
          replyAudio.src = data.reply_audio_url;
          replyAudio.play();

          status.textContent = "Done";
        } catch (err) {
          console.error(err);
          status.textContent = "Error: " + err.message;
        }
      }
    </script>
  </body>
</html>
